name: aparat-upload-test
on: workflow_dispatch
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright && playwright install --with-deps chromium
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: ffmpeg -y -f lavfi -i testsrc=duration=5:size=640x360:rate=25 -f lavfi -i sine=duration=5 -pix_fmt yuv420p -shortest test.mp4
      - run: python upload_aparat.py test.mp4 caption_test.txt
        env:
          APARAT_USER: ${{ secrets.APARAT_USER }}
          APARAT_PASS: ${{ secrets.APARAT_PASS }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: upload-shots
          path: "*.png"
