name: cleanup
on: workflow_dispatch
permissions:
  actions: write
jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ids=$(gh api --paginate "repos/${{ github.repository }}/actions/runs" --jq '.workflow_runs[].id')
          for id in $ids; do
            gh api -X DELETE "repos/${{ github.repository }}/actions/runs/$id" --silent || true
          done
